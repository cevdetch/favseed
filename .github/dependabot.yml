version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    # The site pins these to the runtime the vendored engines in site/vendor/image/ were built
    # and verified against, so the threaded and compatibility engines share one runtime. They
    # move with a rebuild, not with an independent bump.
    ignore:
      - dependency-name: '@emnapi/*'
      - dependency-name: '@napi-rs/wasm-runtime'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci

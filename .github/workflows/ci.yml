name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun --bun run format:check
      - run: bun --bun run lint
      - run: bun run check:package

  linux:
    # Pinned, not ubuntu-latest, so an image flip never arrives inside an unrelated change.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so skip the credential helper.
          persist-credentials: false

      # Bun is pinned to the version in "packageManager"; `--frozen-lockfile` fails on a
      # missing or stale lockfile rather than resolving one from the registry. Node 24 is the
      # engines floor and the current LTS, and runs the hash guard and the npm commands.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      # icoutils is here for one reason: so the ICO-equivalence test runs instead of skipping.
      # It is not a dependency of the tool; favseed writes the 22-byte container itself.
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y icoutils

      # A pinned release tarball, not `cargo install`, which takes minutes. The engine's
      # render test compares against this binary, the same resvg the engine bundles.
      - name: resvg (the reference the engine's render test compares against)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/resvg.tar.gz \
            "https://github.com/linebender/resvg/releases/download/v0.49.0/resvg-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/resvg.tar.gz -C /usr/local/bin resvg
          sudo chmod +x /usr/local/bin/resvg

      # Bun runs the tests; the suites that spawn `node` need the real Node, so not `bun --bun`
      # (it points `node` at Bun). The node-compat job runs the whole root suite under Node.
      - run: bun run test
      - run: node test/hashes.mjs --check > hashes-linux.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-linux
          path: hashes-linux.txt

  macos:
    # Apple Silicon: the engine's darwin-arm64 binary, the whole suite.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: bun run test
      - run: node test/hashes.mjs --check > hashes-macos.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-macos
          path: hashes-macos.txt

  windows:
    # Pinned like the Linux and macOS jobs, so an image flip never arrives inside an unrelated change.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: bun run test
      # bash, not PowerShell: the file must hold the bytes the script printed, LF endings
      # included, or the comparison below fails on line endings alone.
      - run: node test/hashes.mjs --check > hashes-windows.txt
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-windows
          path: hashes-windows.txt

  same-bytes:
    # The engine's claim: one SVG gives the same bytes on every platform.
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hashes-*
          merge-multiple: true
      - run: diff hashes-linux.txt hashes-macos.txt && diff hashes-linux.txt hashes-windows.txt

  astro:
    # Install the tarball as an external consumer: static/dev/Node SSR, not hook stubs.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: bun run test:astro
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

  site:
    # The website imports lib/core.mjs by path, so a change to the shared half can break it
    # without touching site/. Build it and run the real pipeline in a headless browser.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: the sitemap's lastmod is each page's last commit, and a shallow clone
          # would leave every date out.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: bun --filter favseed-site test
      - run: bun --filter favseed-site build
      - run: bun --filter favseed-site test:dist
      # The runner image ships Google Chrome, not a `chromium` binary.
      - run: node site/test/cdp-check.mjs
        env:
          CHROME: google-chrome

  browsers:
    # Playwright covers the other engines and mobile emulation. Keep CDP above for
    # Chromium-specific nested-worker cleanup and back/forward-cache checks.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: firefox
            engine: firefox
          - project: webkit
            engine: webkit
          - project: mobile-chrome
            engine: chromium
          - project: mobile-webkit
            engine: webkit
    env:
      BROWSER_PROJECT: ${{ matrix.project }}
      BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: bunx playwright install --with-deps "$BROWSER_ENGINE"
        working-directory: site
      - run: bun --filter favseed-site build
      - run: bun --filter favseed-site test:browser --project="$BROWSER_PROJECT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-${{ matrix.project }}
          path: site/test-results/
          retention-days: 3

  workflows:
    # Static analysis of the workflows themselves: template injection, over-broad
    # permissions, unpinned actions. zizmor's own version is pinned like every other tool.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.30.1
          advanced-security: false

  node-compat:
    # The published package runs on Node; development runs on Bun. Run the whole root suite
    # under Node's own test runner so a Bun-only assumption cannot slip in.
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node --test test/run.test.mjs test/engine.test.mjs test/pipeline.test.mjs test/config.test.mjs test/vite.test.mjs test/security.test.mjs test/zopfli.test.mjs test/svg-precision.test.mjs test/astro-middleware.test.mjs test/lazy-loading.test.mjs test/astro-dev.test.mjs test/bytes.test.mjs test/write-failures.test.mjs test/bench-corpus.test.mjs test/bench-metrics.test.mjs test/bench-wasm-parity.test.mjs test/bench-compare.test.mjs test/quality.test.mjs test/resolve.test.mjs test/docs.test.mjs

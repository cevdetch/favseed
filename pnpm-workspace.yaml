# One workspace, one lockfile. The root is the published package; site/ is the website, which
# imports lib/core.mjs by path rather than as a dependency, so nothing here links the two.
packages:
  - site

# pnpm blocks dependency lifecycle scripts until each one is decided here. `false` is a
# recorded "no", not an oversight: pnpm otherwise fails the install asking to be told.
#
#   sharp: no. Astro's image service; the site has no <Image> and no raster assets to
#   transform, and its icons are built by favseed itself.
allowBuilds:
  sharp: false

# `pnpm add -D -E -w` refuses to install a package published more recently than the workspace's
# minimum release age; knip 6.44.2 was too new for that guard when it was pinned (2026-11-07) and
# needed this exclusion to install at all. Drop the exclusion once knip 6.44.2 clears the age
# check on its own — it is the exclusion that is temporary, not the pin.
minimumReleaseAgeExclude:
  - knip@6.44.2
